name: Build Android Notifier APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-notifier/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-notifier
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esp32-radar-notifier-apk
          path: android-notifier/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
